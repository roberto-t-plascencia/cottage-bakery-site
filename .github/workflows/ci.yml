name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      spec: ${{ steps.filter.outputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'specs/**'
            api:
              - 'api/**'
              - 'specs/**'
            spec:
              - 'specs/**'

  web:
    name: web/ — lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
        # tests/unit/ never touches api/ or a network — it only exercises
        # the pure logic left in web/ (cart math, date helpers). See
        # ../specs/ENGINEERING_RULES.md "Testing bar."
      - name: Build
        run: npm run build
        # No SUPABASE_* placeholders needed here — see Dockerfile's
        # comment on why that whole class of problem left with the
        # Supabase client when it moved to api/.

  api:
    name: api/ — lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + route tests
        run: npm test
        env:
          # Route tests (tests/routes/) mock the repository layer — see
          # its own comment — so these never reach a real Supabase
          # project, but src/lib/supabase.ts still constructs a client at
          # import time and needs syntactically valid values to do so.
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key
          ADMIN_PASSWORD: ci-placeholder-not-a-real-password
          JWT_SECRET: ci-placeholder-jwt-secret-32-chars-minimum
      - name: Build
        run: npm run build

  spec-drift:
    name: specs/openapi.yaml — no undeclared drift
    needs: changes
    if: needs.changes.outputs.spec == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate api/'s types from specs/openapi.yaml
        working-directory: api
        run: npm ci --legacy-peer-deps && npm run gen:types

      - name: Regenerate web/'s types from specs/openapi.yaml
        working-directory: web
        run: npm ci --legacy-peer-deps && npm run gen:types

      - name: Fail if regenerating changed anything
        run: |
          if ! git diff --exit-code -- api/src/lib/api-schema.generated.ts web/src/lib/api-schema.generated.ts; then
            echo "::error::Committed generated types are stale relative to specs/openapi.yaml. Run 'npm run gen:types' in api/ and web/ and commit the result."
            exit 1
          fi
        # This is the actual enforcement of specs/ENGINEERING_RULES.md's
        # "never hand-edit a *.generated.ts file" rule: a PR that changes
        # a route's real response shape without updating openapi.yaml (or
        # vice versa) fails here, loudly, instead of merging a contract
        # that's quietly stopped being true.

  deploy-placeholder:
    name: main → "deploy" (web/ is real via Vercel; api/ still a placeholder)
    needs: [web, api]
    # always() so this still runs (and explains itself) even when a push
    # to main didn't touch web/ or api/ and those jobs were skipped by
    # the path filter above — skipped is not failed.
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.web.result != 'failure' && needs.api.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build web/ image (build-verification only — see below)
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: cottage-bakery-web:${{ github.sha }}

      - name: Build api/ image (not pushed anywhere)
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          tags: cottage-bakery-api:${{ github.sha }}

      - name: What this job is and isn't
        run: |
          echo "## web/ deploys for real; api/ is still a placeholder" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "web/ is connected to Vercel directly (Vercel's GitHub App," >> "$GITHUB_STEP_SUMMARY"
          echo "not this workflow) — merging to main already triggers a real" >> "$GITHUB_STEP_SUMMARY"
          echo "production deployment there. The web/ image build in this job" >> "$GITHUB_STEP_SUMMARY"
          echo "is just an extra build-verification check (useful for" >> "$GITHUB_STEP_SUMMARY"
          echo "docker-compose / a future non-Vercel host), not the deploy path." >> "$GITHUB_STEP_SUMMARY"
          echo "See docs/adr/0005-deployment-targets.md." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "api/ has no hosting target yet, so its image here is NOT" >> "$GITHUB_STEP_SUMMARY"
          echo "pushed or deployed anywhere. Wiring that up for real means:" >> "$GITHUB_STEP_SUMMARY"
          echo "pick a host (Fly.io, Railway, a VPS, etc.), push images to a" >> "$GITHUB_STEP_SUMMARY"
          echo "registry, add the host's credentials as repo secrets, and" >> "$GITHUB_STEP_SUMMARY"
          echo "replace api/'s 'push: false' above with real push + deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "steps." >> "$GITHUB_STEP_SUMMARY"
