name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        # The unit suite (tests/unit/) never touches Supabase — it only
        # exercises the pure business logic in src/lib/ (cart math, order
        # validation, session signing). See docs/TESTING_STRATEGY.md.

      - name: Build
        run: npm run build
        env:
          # `next build`'s page-data-collection step imports every route
          # module — including src/lib/supabase.ts, which builds a
          # Supabase client eagerly at import time — even for routes that
          # never execute at build time (see the same comment in
          # Dockerfile). Constructing that client makes no network call,
          # so a syntactically valid placeholder gets the build past that
          # import without needing a real Supabase project in CI.
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key
          ADMIN_PASSWORD: ci-placeholder-not-a-real-password
          SESSION_SECRET: ci-placeholder-session-secret-32-chars-minimum
