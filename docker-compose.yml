services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:?Set SUPABASE_URL (Project Settings -> API in your Supabase project)}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY (Project Settings -> API) -- server-side only, never expose this}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your shell or a .env file next to docker-compose.yml}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in your shell or a .env file next to docker-compose.yml}
    restart: unless-stopped
    # No volume: Supabase (Postgres + Storage) is the persistence layer,
    # not this container — see docs/adr/0001-tech-stack.md. The container
    # itself is fully disposable.
